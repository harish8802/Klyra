job:
  name: products
  type: batch
  frequency: daily
  mode: load

source:
  name: crm
  type: file
  format: csv
  header: True
  delimiter: ','
  path: '/Volumes/klyra/landing_zone/crm/daily_data/'
  date_format: 'dd/MM/yyyy'
  timestamp_format: 'yyyy/MM/dd HH:mm:ss'
  file_format: 'crm_products_{dd}-{MM}-{yyyy}.csv'

target:
  raw:
    catalog: klyra
    schema: raw
    table: crm_products
    format: delta
  master:
    catalog: klyra
    schema: bronze
    table: crm_products
    format: delta
  write:
    mode: merge
    keys: product_id

validation:
  non_nullable:
    columns:
      - product_id
